
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: polybot-dev
  name: polybot-dev
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polybot-dev
  template:
    metadata:
      labels:
        app: polybot-dev
    spec:
      containers:
      - env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              key: TELEGRAM_BOT_TOKEN
              name: my-secrets-dev
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              key: BUCKET_ID
              name: my-secrets-dev
        - name: BOT_APP_URL
          value: https://haitham-dev.fursa.click
        image: haithammahajna/polybot-dev:86
        name: polybot-container
---
apiVersion: v1
kind: Service
metadata:
  name: polybot-dev
  namespace: dev
spec:
  selector:
    app: polybot-dev
  ports:
    - port: 8443
      targetPort: 8443